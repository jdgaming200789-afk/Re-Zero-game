<!doctype html>
<html><body style="margin:0;background:#2a2c33">
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
const q = new URLSearchParams(location.search);
const W = +(q.get('w') ?? 520), Hh = +(q.get('h') ?? 640);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, Hh);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(q.get('flat') ? '#e8e8ec' : '#8d939e');
scene.add(new THREE.HemisphereLight('#ffffff', '#888899', 1.6));
const key = new THREE.DirectionalLight('#ffffff', 2.2); key.position.set(1.5, 3, 3); scene.add(key);
const gltf = await new GLTFLoader().loadAsync(q.get('glb'));
const root = gltf.scene; scene.add(root);
const hide = (q.get('hide') ?? '').split(',').filter(Boolean);
const flat = q.get('flat');
const grad = new THREE.DataTexture(new Uint8Array([90, 90, 90, 255, 200, 200, 200, 255, 255, 255, 255, 255]), 3, 1);
grad.needsUpdate = true;
root.traverse((o) => {
  if (!o.isMesh) return;
  if (hide.some((h) => o.name.includes(h))) { o.visible = false; return; }
  const old = o.material;
  o.material = flat
    ? new THREE.MeshBasicMaterial({ color: '#3a3355' })
    : new THREE.MeshToonMaterial({ color: old.color, map: old.map, vertexColors: !!o.geometry.attributes.color, gradientMap: grad, side: THREE.DoubleSide });
  o.frustumCulled = false;
});
// arms=back swings the upper arms back (side views show the torso's profile).
if (q.get('arms')) {
  const ang = (+q.get('arms') * Math.PI) / 180;
  root.updateMatrixWorld(true);
  root.traverse((o) => {
    if (!o.isBone || !/^upperArm/.test(o.name)) return;
    const pw = new THREE.Quaternion(); o.parent.getWorldQuaternion(pw);
    const axis = new THREE.Vector3(1, 0, 0).applyQuaternion(pw.clone().invert());
    o.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(axis, ang));
  });
  root.updateMatrixWorld(true);
}
const box = new THREE.Box3().setFromObject(root);
const H = box.max.y - box.min.y;
window.__H = H; 
// view: az (deg, 0 = front), el (deg), cy (fraction of H), size (fraction of H, ortho height)
window.__render = (az, el, cy, size, persp, clipx) => {
  renderer.clippingPlanes = clipx ? [new THREE.Plane(new THREE.Vector3(-1, 0, 0), clipx * H), new THREE.Plane(new THREE.Vector3(1, 0, 0), clipx * H)] : [];
  const r = 5 * H, a = (az * Math.PI) / 180, e = (el * Math.PI) / 180;
  const at = new THREE.Vector3(0, box.min.y + cy * H, 0);
  let cam;
  const half = (size * H) / 2, asp = W / Hh;
  if (persp) { cam = new THREE.PerspectiveCamera(28, asp, 0.01, 50); const d = half / Math.tan((14 * Math.PI) / 180); cam.position.set(Math.sin(a) * Math.cos(e) * d, Math.sin(e) * d, Math.cos(a) * Math.cos(e) * d).add(at); }
  else { cam = new THREE.OrthographicCamera(-half * asp, half * asp, half, -half, 0.01, 50); cam.position.set(Math.sin(a) * Math.cos(e) * r, Math.sin(e) * r, Math.cos(a) * Math.cos(e) * r).add(at); }
  cam.lookAt(at);
  key.position.copy(cam.position).add(new THREE.Vector3(1.2, 2, 0));
  renderer.render(scene, cam);
};
document.body.dataset.ready = '1';
</script></body></html>
